name: bc-utils tests

on:
  push:

  pull_request:

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11" ]

    steps:

    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync

    - name: Install patchright browser
      run: |
        uv run patchright install --with-deps chromium

    - name: Check formatting with ruff
      run: |
        uv run ruff format --check bcutils sample

    - name: Lint with ruff
      run: |
        uv run ruff check bcutils sample

    - name: Type check with mypy
      run: |
        uv run mypy bcutils sample

    - name: Unit tests with pytest
      env:
        BARCHART_USERNAME: ${{ secrets.BARCHART_USERNAME }}
        BARCHART_PASSWORD: ${{ secrets.BARCHART_PASSWORD }}
      run: |
        xvfb-run -a uv run python -m pytest
