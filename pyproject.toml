[project]
name = "bc-utils"
version = "0.1.7"
description = "Python utility automation scripts for Barchart.com"
authors = [
    { name = "Andy Geach", email = "andy@bugorfeature.net" }
]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "requests>=2,<3",
    "numpy<2",
    "pandas<3",
    "beautifulsoup4>=4,<5",
    "pyyaml>=6.0.1,<7",
]

[project.urls]
Homepage = "https://github.com/bug-or-feature/bc-utils"
Repository = "https://github.com/bug-or-feature/bc-utils"
Issues = "https://github.com/bug-or-feature/bc-utils/issues"

[dependency-groups]
dev = [
    "pytest>=7,<8",
    "ruff>=0.8,<0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bcutils"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["E203"]
